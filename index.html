<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Liquidaciones diarias y mensuales para conductores de taxi y VTC. Calcula tu parte, lo que cobra la empresa y el efectivo que llevas encima." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TXpro" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f5f6fa" />
  <meta name="color-scheme" content="light dark" />
  <title>TXpro · Cuentas del taxi</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preload" as="script" href="./vendor/react.production.min.js" />
  <link rel="preload" as="script" href="./vendor/react-dom.production.min.js" />
  <link rel="stylesheet" href="./fonts/dmsans.css" />
  <link rel="preload" as="font" type="font/woff2" href="./fonts/dmsans-latin.woff2" crossorigin />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --fondo: #f5f6fa; --fila: #f2f4fa; --barra: #d5d8e3; --gris: #8f93a8; color-scheme: light; }
    html[data-tema="oscuro"] { --fondo: #0e1016; --fila: #1d212b; --barra: #3a3f4d; --gris: #767b8e; color-scheme: dark; }
    html, body { height: 100%; background: var(--fondo); overflow-x: hidden; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    .inp:focus { border-color: #f0c040 !important; outline: none; }
    .saveBtn:active { opacity: 0.85; }
    .nb:active { opacity: 0.7; }
    button:focus-visible, .inp:focus-visible { outline: 2px solid #c08a06; outline-offset: 2px; }
    tr:hover td { background: var(--fila); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--barra); border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    #boot { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--gris); font-size: 14px; }
  </style>
  <script>
    // El tema se decide antes de pintar nada, para que quien lo tiene oscuro
    // no vea un fogonazo blanco al abrir. La app lo vuelve a aplicar al arrancar.
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("tc_tema") || '"auto"');
        var oscuro = t === "oscuro" || (t !== "claro" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (oscuro) {
          document.documentElement.setAttribute("data-tema", "oscuro");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e1016");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"><div id="boot">Cargando…</div></div>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./app.js"></script>
  <script>
    // The app updates itself: a new release is downloaded in the background and
    // applied only when the driver taps the notice, never mid-entry.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").then(function (reg) {
          function offer(worker) {
            if (!worker) return;
            window.tcApplyUpdate = function () { worker.postMessage({ type: "SKIP_WAITING" }); };
            window.dispatchEvent(new CustomEvent("tc:update-ready"));
          }
          if (reg.waiting) offer(reg.waiting);
          reg.addEventListener("updatefound", function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener("statechange", function () {
              if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
            });
          });
        }).catch(function () { /* sin service worker la app sigue funcionando */ });

        // On the very first visit the worker claims this page, which also fires
        // controllerchange. Reloading there would wipe whatever is half typed,
        // so only an actual update (there was already a controller) reloads.
        var hadController = !!navigator.serviceWorker.controller;
        var refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hadController || refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
